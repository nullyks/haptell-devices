<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Haptell UDP Sender</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <h1>Haptell UDP Sender</h1>
          <p>Send local UDP commands and LRA envelope shapes to Haptell devices.</p>
        </div>
        <div class="status" id="status">Ready</div>
      </header>

      <section class="settings" aria-label="Device settings">
        <label>
          Device IP
          <input id="ipAddress" type="text" inputmode="decimal" value="192.168.1.42">
        </label>
        <label>
          UDP port
          <input id="port" type="number" min="1" max="65535" value="4444">
        </label>
        <label>
          Target
          <select id="target">
            <option value="haptell-02">haptell-02</option>
            <option value="haptell-01">haptell-01</option>
            <option value="all">all</option>
          </select>
        </label>
      </section>

      <section class="commands" aria-label="Commands">
        <article class="command">
          <div>
            <h2>Pulse</h2>
            <p>Single vibration pulse.</p>
          </div>
          <div class="params">
            <label>
              intensity
              <input id="pulseIntensity" type="number" min="0" max="255" value="180">
            </label>
            <label>
              duration
              <input id="pulseDuration" type="number" min="0" value="800">
            </label>
          </div>
          <button type="button" data-command="pulse">Send Pulse</button>
        </article>

        <article class="command">
          <div>
            <h2>Double</h2>
            <p>Two short taps.</p>
          </div>
          <div class="params">
            <label>
              intensity
              <input id="doubleIntensity" type="number" min="0" max="255" value="220">
            </label>
            <label>
              gap
              <input id="doubleGap" type="number" min="0" value="120">
            </label>
          </div>
          <button type="button" data-command="double">Send Double</button>
        </article>

        <article class="command">
          <div>
            <h2>Ramp</h2>
            <p>Ramp from low to high intensity.</p>
          </div>
          <div class="params">
            <label>
              from
              <input id="rampFrom" type="number" min="0" max="255" value="60">
            </label>
            <label>
              to
              <input id="rampTo" type="number" min="0" max="255" value="255">
            </label>
            <label>
              duration
              <input id="rampDuration" type="number" min="0" value="1200">
            </label>
          </div>
          <button type="button" data-command="ramp">Send Ramp</button>
        </article>
      </section>

      <section class="designer" aria-label="Shape designer">
        <div class="section-head">
          <div>
            <h2>Shape Designer</h2>
            <p>Amplitude envelope for DC motor and LRA firmware variants.</p>
          </div>
          <button id="sendShape" type="button" data-command="shape">Send Shape</button>
        </div>

        <div class="designer-controls">
          <label>
            duration ms
            <input id="shapeDuration" type="number" min="100" max="5000" step="20" value="1600">
          </label>
          <label>
            max points
            <input id="maxPoints" type="text" value="24" readonly>
          </label>
          <div class="preset-buttons" aria-label="Shape presets">
            <button data-preset="tap" type="button">Tap</button>
            <button data-preset="double" type="button">Double</button>
            <button data-preset="pulse" type="button">Pulse</button>
            <button data-preset="ramp" type="button">Ramp</button>
            <button data-preset="heartbeat" type="button">Heartbeat</button>
          </div>
        </div>

        <div class="designer-grid">
          <div class="graph-panel">
            <svg id="envelopeGraph" viewBox="0 0 720 320" role="img" aria-label="LRA envelope graph">
              <rect class="graph-bg" x="48" y="24" width="640" height="240"></rect>
              <g id="gridLayer"></g>
              <path id="envelopeFill"></path>
              <polyline id="envelopeLine"></polyline>
              <g id="pointLayer"></g>
            </svg>
          </div>

          <div class="points-panel">
            <div class="points-head">
              <h3>Points</h3>
              <button id="addPoint" type="button">Add Point</button>
            </div>
            <div id="pointsList" class="points-list"></div>
          </div>
        </div>
      </section>

      <section class="preview" aria-label="Command preview">
        <label>
          Command preview
          <input id="commandPreview" type="text" readonly value="haptell-02 pulse intensity=180 duration=800">
        </label>
        <label>
          Data array preview
          <textarea id="dataPreview" readonly rows="10"></textarea>
        </label>
      </section>

      <section class="stop-row" aria-label="Stop command">
        <button class="stop-button" type="button" data-command="stop">Send Stop</button>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
