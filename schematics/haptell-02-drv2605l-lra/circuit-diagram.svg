<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">haptell-02 DRV2605L LRA haptic driver circuit</title>
  <desc id="desc">Clear wiring diagram for Arduino UNO R4 WiFi, Seeed Studio LiPo Rider Plus, 3.7 V LiPo battery, Mavaol DRV2605L haptic driver module, and Vybronics VG1040003D LRA actuator.</desc>
  <defs>
    <style>
      .page { fill: #ffffff; }
      .board { fill: #f4f7fb; stroke: #233044; stroke-width: 3; }
      .part { fill: #fff9ec; stroke: #233044; stroke-width: 3; }
      .powerPart { fill: #fff1f1; stroke: #7b2f2f; stroke-width: 3; }
      .note { fill: #eef8f3; stroke: #426652; stroke-width: 2; }
      .wire { fill: none; stroke: #202b3d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .signal { fill: none; stroke: #315aa8; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .power { fill: none; stroke: #b52b2b; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .ground { fill: none; stroke: #2f6d45; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .actuator { fill: none; stroke: #7d4aa8; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .node { fill: #202b3d; }
      .label { font: 26px Arial, sans-serif; font-weight: 700; fill: #142033; }
      .text { font: 22px Arial, sans-serif; fill: #142033; }
      .small { font: 18px Arial, sans-serif; fill: #142033; }
      .tiny { font: 16px Arial, sans-serif; fill: #142033; }
      .pinText { font: 20px Arial, sans-serif; fill: #142033; }
      .terminal { fill: #ffffff; stroke: #202b3d; stroke-width: 3; }
      .gndLine { stroke: #2f6d45; stroke-width: 4; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1400" height="980" class="page"/>

  <text x="60" y="54" class="label">haptell-02 DRV2605L LRA haptic driver</text>
  <text x="60" y="86" class="small">Arduino UNO R4 WiFi sends I2C commands. The DRV2605L drives the LRA differentially.</text>

  <!-- Battery and power module -->
  <rect x="60" y="150" width="300" height="145" rx="14" class="powerPart"/>
  <text x="94" y="202" class="label">BT1 LiPo</text>
  <text x="94" y="236" class="small">3.7 V 1S protected</text>
  <text x="94" y="264" class="small">battery</text>
  <circle cx="360" cy="222" r="8" class="terminal"/>

  <rect x="500" y="130" width="345" height="190" rx="14" class="powerPart"/>
  <text x="536" y="183" class="label">LiPo Rider Plus</text>
  <text x="536" y="218" class="small">charger / booster</text>
  <text x="536" y="248" class="small">regulated 5 V output</text>
  <text x="536" y="278" class="small">USB-C charging</text>
  <circle cx="500" cy="222" r="8" class="terminal"/>
  <circle cx="845" cy="185" r="8" class="terminal"/>
  <circle cx="845" cy="270" r="8" class="terminal"/>

  <path d="M360 222 H500" class="power"/>
  <text x="388" y="206" class="tiny">battery input</text>

  <!-- Arduino board -->
  <rect x="70" y="410" width="360" height="330" rx="14" class="board"/>
  <text x="105" y="462" class="label">Arduino UNO R4 WiFi</text>
  <text x="112" y="536" class="pinText">USB-C 5V IN</text>
  <circle cx="390" cy="528" r="8" class="node"/>
  <text x="112" y="594" class="pinText">GND</text>
  <circle cx="390" cy="586" r="8" class="node"/>
  <text x="112" y="652" class="pinText">SDA</text>
  <circle cx="390" cy="644" r="8" class="node"/>
  <text x="112" y="710" class="pinText">SCL</text>
  <circle cx="390" cy="702" r="8" class="node"/>

  <!-- DRV2605L module -->
  <rect x="780" y="430" width="340" height="300" rx="14" class="part"/>
  <text x="825" y="482" class="label">U2 DRV2605L</text>
  <text x="830" y="516" class="small">Mavaol haptic driver</text>
  <text x="830" y="546" class="small">I2C, LRA mode</text>

  <text x="805" y="584" class="pinText">VIN / VCC</text>
  <circle cx="780" cy="596" r="8" class="node"/>
  <text x="805" y="628" class="pinText">GND</text>
  <circle cx="780" cy="640" r="8" class="node"/>
  <text x="805" y="676" class="pinText">SDA</text>
  <circle cx="780" cy="684" r="8" class="node"/>
  <text x="805" y="708" class="pinText">SCL</text>
  <circle cx="780" cy="716" r="8" class="node"/>

  <text x="990" y="592" class="pinText">OUT+</text>
  <circle cx="1120" cy="610" r="8" class="node"/>
  <text x="990" y="706" class="pinText">OUT-</text>
  <circle cx="1120" cy="676" r="8" class="node"/>

  <!-- LRA actuator -->
  <rect x="1195" y="548" width="155" height="190" rx="55" class="part"/>
  <text x="1222" y="615" class="label">M1</text>
  <text x="1218" y="648" class="small">VG1040003D</text>
  <text x="1230" y="676" class="small">LRA</text>
  <text x="1216" y="704" class="tiny">2.5 Vrms, 170 Hz</text>
  <circle cx="1195" cy="610" r="8" class="terminal"/>
  <circle cx="1195" cy="676" r="8" class="terminal"/>

  <!-- 5V power input and ground distribution -->
  <path d="M845 185 H910 V365 H520 V528 H390" class="power"/>
  <path d="M750 365 V596 H780" class="power"/>
  <circle cx="520" cy="528" r="7" class="node"/>
  <text x="884" y="170" class="tiny">LiPo Rider 5 V output</text>

  <path d="M845 270 H740 V790 H455 V586 H390" class="ground"/>
  <path d="M740 640 H780" class="ground"/>
  <circle cx="740" cy="640" r="7" class="node"/>
  <text x="930" y="292" class="tiny">common GND</text>

  <!-- I2C wiring -->
  <path d="M390 644 H620 V684 H780" class="signal"/>
  <path d="M390 702 H650 V716 H780" class="signal"/>
  <text x="470" y="626" class="tiny">I2C SDA</text>
  <text x="470" y="736" class="tiny">I2C SCL</text>

  <!-- Actuator output -->
  <path d="M1120 610 H1195" class="actuator"/>
  <path d="M1120 676 H1195" class="actuator"/>
  <text x="1132" y="514" class="tiny">differential</text>
  <text x="1132" y="536" class="tiny">haptic output</text>

  <!-- Ground symbol -->
  <line x1="990" y1="824" x2="1060" y2="824" class="gndLine"/>
  <line x1="1005" y1="844" x2="1045" y2="844" class="gndLine"/>
  <line x1="1018" y1="864" x2="1032" y2="864" class="gndLine"/>
  <path d="M740 790 H1025 V824" class="ground"/>

  <!-- Legend -->
  <rect x="60" y="805" width="850" height="140" rx="12" class="note"/>
  <line x1="92" y1="835" x2="160" y2="835" class="power"/>
  <text x="178" y="842" class="small">5 V power</text>
  <line x1="340" y1="835" x2="408" y2="835" class="ground"/>
  <text x="426" y="842" class="small">common ground</text>
  <line x1="605" y1="835" x2="673" y2="835" class="signal"/>
  <text x="692" y="842" class="small">I2C control</text>
  <line x1="92" y1="878" x2="160" y2="878" class="actuator"/>
  <text x="178" y="885" class="small">DRV2605L OUT+ / OUT- to LRA</text>
  <text x="92" y="918" class="tiny">Do not connect the LRA directly to Arduino GPIO.</text>
  <text x="92" y="940" class="tiny">Do not add a DC motor flyback diode across DRV2605L OUT+ and OUT-.</text>
</svg>
