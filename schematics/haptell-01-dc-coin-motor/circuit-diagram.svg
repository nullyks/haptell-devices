<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">haptell-01 DC coin vibration motor driver circuit</title>
  <desc id="desc">Clear wiring diagram for Arduino UNO R4 WiFi, a 3-5 V DC coin vibration motor, IRF3205 MOSFET, gate resistor, gate pulldown resistor, and 1N5819 flyback diode.</desc>
  <defs>
    <style>
      .page { fill: #ffffff; }
      .board { fill: #f4f7fb; stroke: #233044; stroke-width: 3; }
      .part { fill: #fff9ec; stroke: #233044; stroke-width: 3; }
      .note { fill: #eef8f3; stroke: #426652; stroke-width: 2; }
      .wire { fill: none; stroke: #202b3d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .signal { fill: none; stroke: #315aa8; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .power { fill: none; stroke: #b52b2b; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .ground { fill: none; stroke: #2f6d45; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .node { fill: #202b3d; }
      .label { font: 26px Arial, sans-serif; font-weight: 700; fill: #142033; }
      .text { font: 22px Arial, sans-serif; fill: #142033; }
      .small { font: 18px Arial, sans-serif; fill: #142033; }
      .tiny { font: 16px Arial, sans-serif; fill: #142033; }
      .pinText { font: 20px Arial, sans-serif; fill: #142033; }
      .terminal { fill: #ffffff; stroke: #202b3d; stroke-width: 3; }
      .gndLine { stroke: #2f6d45; stroke-width: 4; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1400" height="980" class="page"/>

  <text x="60" y="54" class="label">haptell-01 DC coin vibration motor driver</text>
  <text x="60" y="86" class="small">Arduino UNO R4 WiFi low-side MOSFET wiring. Motor current does not flow through the GPIO pin.</text>

  <!-- Arduino board -->
  <rect x="60" y="130" width="330" height="540" rx="14" class="board"/>
  <text x="95" y="180" class="label">Arduino UNO R4 WiFi</text>

  <text x="96" y="255" class="pinText">D9 PWM</text>
  <circle cx="350" cy="248" r="8" class="node"/>

  <text x="96" y="355" class="pinText">5V</text>
  <circle cx="350" cy="348" r="8" class="node"/>

  <text x="96" y="555" class="pinText">GND</text>
  <circle cx="350" cy="548" r="8" class="node"/>

  <text x="96" y="620" class="tiny">First bench test power:</text>
  <text x="96" y="646" class="tiny">9V battery to barrel jack / VIN</text>

  <!-- Signal path -->
  <path d="M350 248 H500" class="signal"/>
  <rect x="500" y="216" width="150" height="64" rx="8" class="part"/>
  <text x="531" y="242" class="small">R1</text>
  <text x="520" y="268" class="small">220 ohm</text>
  <path d="M650 248 H760 V575 H885" class="signal"/>
  <circle cx="760" cy="575" r="7" class="node"/>
  <text x="680" y="232" class="tiny">PWM gate signal</text>

  <!-- Gate pulldown -->
  <rect x="675" y="615" width="170" height="62" rx="8" class="part"/>
  <text x="710" y="640" class="small">R2</text>
  <text x="704" y="665" class="small">10k pulldown</text>
  <path d="M760 575 V615" class="wire"/>
  <path d="M760 677 V690" class="ground"/>

  <!-- Power path to motor -->
  <path d="M350 348 H765 V300 H825" class="power"/>
  <circle cx="765" cy="300" r="7" class="node"/>
  <text x="540" y="332" class="tiny">5V motor supply</text>

  <!-- Motor -->
  <rect x="825" y="235" width="245" height="130" rx="12" class="part"/>
  <text x="870" y="282" class="label">M1 motor</text>
  <text x="868" y="315" class="small">3-5 V DC coin</text>
  <text x="889" y="342" class="small">67 mA rated</text>
  <circle cx="825" cy="300" r="8" class="terminal"/>
  <circle cx="1070" cy="300" r="8" class="terminal"/>
  <text x="792" y="306" class="small">+</text>
  <text x="1084" y="306" class="small">-</text>

  <!-- Switched motor negative / drain node -->
  <path d="M1070 300 H1145 V430" class="wire"/>
  <circle cx="1145" cy="430" r="7" class="node"/>
  <text x="1162" y="392" class="tiny">motor - / MOSFET drain</text>

  <!-- Flyback diode, separated from motor and MOSFET -->
  <path d="M765 300 V420 H825" class="power"/>
  <rect x="825" y="385" width="245" height="90" rx="10" class="part"/>
  <text x="858" y="420" class="small">D1 1N5819 diode</text>
  <text x="844" y="448" class="tiny">cathode / marked end -> 5V</text>
  <text x="872" y="468" class="tiny">anode -> drain node</text>
  <path d="M1070 430 H1145" class="wire"/>
  <circle cx="825" cy="430" r="8" class="terminal"/>
  <circle cx="1070" cy="430" r="8" class="terminal"/>

  <!-- MOSFET -->
  <rect x="885" y="505" width="260" height="140" rx="12" class="part"/>
  <text x="928" y="552" class="label">Q1 IRF3205</text>
  <text x="938" y="586" class="small">N-channel MOSFET</text>
  <text x="908" y="626" class="tiny">gate</text>
  <text x="1080" y="492" class="tiny">drain</text>
  <text x="1075" y="675" class="tiny">source</text>

  <path d="M1145 430 V505" class="wire"/>
  <path d="M1145 645 V690 H350 V548" class="ground"/>
  <circle cx="1145" cy="690" r="7" class="node"/>
  <circle cx="760" cy="690" r="7" class="node"/>

  <!-- Ground symbol -->
  <line x1="1110" y1="724" x2="1180" y2="724" class="gndLine"/>
  <line x1="1125" y1="744" x2="1165" y2="744" class="gndLine"/>
  <line x1="1138" y1="764" x2="1152" y2="764" class="gndLine"/>
  <path d="M1145 690 V724" class="ground"/>

  <!-- Legend -->
  <rect x="60" y="805" width="1280" height="130" rx="12" class="note"/>
  <line x1="92" y1="835" x2="160" y2="835" class="signal"/>
  <text x="178" y="842" class="small">PWM / gate signal</text>
  <line x1="405" y1="835" x2="473" y2="835" class="power"/>
  <text x="492" y="842" class="small">5V motor supply</text>
  <line x1="735" y1="835" x2="803" y2="835" class="ground"/>
  <text x="822" y="842" class="small">common ground</text>
  <text x="92" y="875" class="tiny">Do not connect the motor directly to an Arduino GPIO pin. The GPIO only drives the MOSFET gate.</text>
  <text x="92" y="908" class="tiny">For future ESP32/ESP8266 versions, use a MOSFET that switches well at 3.3V gate drive.</text>
</svg>
